<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa Komunitarioa</title>
  <meta name="description" content="Mapa comunitario de recursos en Bizkaia" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Mapa Komunitarioa</h1>
      <p>Explora recursos comunitarios y filtra por temática, población, tipo y zona.</p>
    </header>

    <section class="layout">
      <aside class="panel" aria-label="Filtros de recursos">
        <div class="panel-head">
          <h2>Filtros</h2>
          <p><strong id="count">0</strong> recursos visibles</p>
        </div>

        <div class="field">
          <label for="q">Buscar por título</label>
          <input id="q" type="search" placeholder="Ej. Ayuntamiento de Durango" />
        </div>

        <div class="field">
          <label for="tema">Temática</label>
          <select id="tema"><option value="">Todas</option></select>
        </div>

        <div class="field">
          <label for="poblacion">Población</label>
          <select id="poblacion"><option value="">Todas</option></select>
        </div>

        <div class="field">
          <label for="tipo">Tipo de recurso</label>
          <select id="tipo"><option value="">Todos</option></select>
        </div>

        <div class="field">
          <label for="zona">Zona</label>
          <select id="zona"><option value="">Todas</option></select>
        </div>

        <button id="reset" type="button">Reiniciar filtros</button>

        <section class="legend" aria-label="Leyenda por tipo de recurso">
          <h3>Leyenda</h3>
          <ul id="legend-items"></ul>
        </section>
      </aside>

      <section class="map-shell" aria-label="Mapa de recursos">
        <div id="map"></div>
        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
