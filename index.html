<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa Komunitarioa</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Mapa Komunitarioa</h1>
    <p>Recursos comunitarios — búsqueda y filtros</p>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="control">
        <label for="q">Buscar por título</label>
        <input id="q" type="text" placeholder="Ej. Ayuntamiento de Durango" />
      </div>

      <div class="control">
        <label for="tema">Temática</label>
        <select id="tema"><option value="">Todas</option></select>
      </div>

      <div class="control">
        <label for="poblacion">Población diana</label>
        <select id="poblacion"><option value="">Todas</option></select>
      </div>

      <div class="row">
        <button id="reset">Limpiar filtros</button>
      </div>

      <div class="stats">
        <strong id="count">0</strong> recursos visibles
      </div>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>

      <div id="legend" class="legend">
        <h3>Tipo de recurso</h3>
        <ul id="legend-items"></ul>
      </div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
